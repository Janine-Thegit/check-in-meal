<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18140F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meal Check-in</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#18140F; --paper:#EFE7DA; --card:#F7F1E6; --line:#D6CABA; --mute:#6E655A;
  --green:#6B8F5E; --amber:#D9A441; --red:#B5503F; --grey:#A39B8F; --water:#5B7C99;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--ink);color:var(--paper);padding:22px 20px 18px}
header h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0}
header .sub{opacity:.7;font-size:14px;margin-top:2px}
main{max-width:560px;margin:0 auto;padding:20px 18px 80px}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:26px 0 10px}
h2:first-child{margin-top:4px}
h3{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:22px 0 8px}
.hidden{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;border-radius:999px;font:inherit;cursor:pointer}
.chip.sel{background:var(--ink);color:var(--paper)}
.chip.add{border-style:dashed;color:var(--mute);border-color:var(--mute)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;padding:10px 14px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);font:inherit}
.go{display:block;margin:30px auto 0;width:68px;height:68px;border-radius:50%;border:none;background:var(--ink);color:var(--paper);font-size:30px;cursor:pointer}
.go:disabled{opacity:.25;cursor:default}
.back{background:none;border:none;font:inherit;color:var(--mute);padding:0;cursor:pointer;margin-bottom:6px}
.ctx{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px}
.rcs{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer}
.rc .dot{flex:none;width:22px;height:22px;border-radius:50%;margin-top:2px}
.rc .nm{font-weight:500;display:block}
.rc .rl{font-size:14px;color:var(--mute);display:block}
.rc.sel{border-color:var(--ink);border-width:2.5px;padding:11.5px 13.5px}
.g .dot,.dot.g{background:var(--green)}.a .dot,.dot.a{background:var(--amber)}.r .dot,.dot.r{background:var(--red)}.n .dot,.dot.n{background:var(--grey)}
.save{display:block;width:100%;margin-top:28px;padding:15px;border:none;border-radius:999px;background:var(--ink);color:var(--paper);font:inherit;font-weight:500;cursor:pointer}
.save:disabled{opacity:.25;cursor:default}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{background:none;border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;position:relative}
.entry .top{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.entry .mn{font-family:'Fraunces',serif;font-size:19px;margin:2px 0 8px}
.dots{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.dots span{display:flex;align-items:center;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;display:inline-block}
.dots i.g{background:var(--green)}.dots i.a{background:var(--amber)}.dots i.r{background:var(--red)}.dots i.n{background:var(--grey)}
.sum{border-radius:14px;padding:16px 18px;margin-top:10px;color:#fff;display:flex;align-items:center;gap:16px}
.sum.g{background:var(--green)}.sum.a{background:var(--amber);color:var(--ink)}.sum.r{background:var(--red)}.sum.n{background:var(--grey)}
.sum .pts{font-family:'Fraunces',serif;font-size:40px;line-height:1}
.sum .lbl{font-weight:500}
.sum .sub2{font-size:13px;opacity:.9}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-left:8px}
.badge i{width:12px;height:12px;border-radius:50%;display:inline-block}
.badge i.g{background:var(--green)}.badge i.a{background:var(--amber)}.badge i.r{background:var(--red)}.badge i.n{background:var(--grey)}
.x{position:absolute;top:8px;right:10px;background:none;border:none;font-size:20px;color:var(--mute);cursor:pointer}
.confirm{margin-top:10px;font-size:14px;display:flex;gap:14px;align-items:center}
.confirm button{background:none;border:none;font:inherit;cursor:pointer;color:var(--ink);text-decoration:underline;padding:0}
.quiet{color:var(--mute);margin:18px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.ghost{display:block;width:100%;margin-top:12px;padding:14px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.go + .ghost{margin-top:26px}
.wread{font-family:'Fraunces',serif;font-size:64px;text-align:center;margin:26px 0 14px;line-height:1}
.wrange{-webkit-appearance:none;appearance:none;display:block;width:100%;height:14px;border-radius:999px;background:var(--line);outline:none;margin:22px 0 10px;touch-action:pan-y}
.wrange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:36px;height:36px;margin-top:-11px;border-radius:50%;background:var(--ink);border:4px solid var(--paper);box-shadow:0 0 0 1.5px var(--ink)}
.wrange::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--ink);border:4px solid var(--paper);box-shadow:0 0 0 1.5px var(--ink)}
.wrange::-moz-range-track{background:transparent;height:14px}
.wticks{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:0 4px}
.wbar{height:8px;border-radius:999px;background:var(--line);margin-top:2px;overflow:hidden}
.wbar span{display:block;height:100%;background:var(--water)}
.wchange{margin-top:12px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;font:inherit;color:var(--ink);cursor:pointer}
.hd{display:block;font-family:'Fraunces',serif;font-size:17px}
.hs{display:block;font-size:13px;color:var(--mute)}
.hr{display:flex;align-items:center;gap:10px;flex:none}
.hp{font-family:'Fraunces',serif;font-size:22px}
.hc{width:16px;height:16px;border-radius:50%;display:inline-block}
.hc.g{background:var(--green)}.hc.a{background:var(--amber)}.hc.r{background:var(--red)}.hc.n{background:var(--grey)}
</style>
</head>
<body>
<header>
  <h1>Meal Check-in</h1>
  <div class="sub" id="today"></div>
</header>
<main>

<section id="s1">
  <h2>Which meal?</h2>
  <div class="chips" id="mealChips"></div>
  <div id="whereBox">
    <h2>Where?</h2>
    <div class="chips" id="locChips"></div>
    <div class="addrow hidden" id="addRow">
      <input id="addInput" maxlength="30" placeholder="New place" autocomplete="off">
      <button class="link" id="addOk">Add</button>
    </div>
  </div>
  <button class="go" id="go1" disabled aria-label="Continue">&rsaquo;</button>
  <button class="ghost hidden" id="toDay">Today's meals</button>
  <button class="ghost" id="toHist">Previous days</button>
</section>

<section id="s2" class="hidden">
  <button class="back" id="back2">&lsaquo; Back</button>
  <p class="ctx" id="ctx"></p>
  <h2>Portion size</h2>
  <div class="rcs" id="portionBox"></div>
  <h2>Composition</h2>
  <h3>Protein</h3><div class="rcs" id="proteinBox"></div>
  <h3>Carbs</h3><div class="rcs" id="carbBox"></div>
  <h3>Fat</h3><div class="rcs" id="fatBox"></div>
  <button class="save" id="save" disabled>Save</button>
</section>

<section id="s3" class="hidden">
  <button class="back hidden" id="back3">&lsaquo; Previous days</button>
  <div class="head">
    <h2 style="margin:4px 0" id="dayTitle">Today's meals</h2>
    <button class="link" id="copy">Copy as text</button>
  </div>
  <div id="summary"></div>
  <div id="list"></div>
  <button class="save" id="again">Add a meal</button>
  <button class="save hidden" id="backToday">Back to today</button>
  <button class="ghost" id="toHist2">Previous days</button>
</section>

<section id="s4" class="hidden">
  <button class="back" id="back4">&lsaquo; Back</button>
  <h2 style="margin:4px 0">Previous days</h2>
  <div id="hist"></div>
</section>

<section id="s5" class="hidden">
  <button class="back" id="back5">&lsaquo; Back</button>
  <p class="ctx" id="wctx">Water</p>
  <div class="wread" id="wRead">0 L</div>
  <input type="range" class="wrange" id="wRange" min="0" max="5" step="0.25" value="0" aria-label="Litres of water">
  <div class="wticks"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5 L</span></div>
  <p class="quiet">Set the total for the day so far. Saving again replaces it.</p>
  <button class="save" id="wSave">Save</button>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
/* ---------- Colour rules: edit these to suit your plan ---------- */
const TL = {g:'Green', a:'Amber', r:'Red', n:'None'};
const NONE = ['None in this','Not part of this one'];
const RULES = {
  meal: {
    portion: {
      g:['On plan','One plate, no seconds, some plate still showing'],
      a:['Full','Plate piled high, or a small second serving'],
      r:['Over','A full second helping, or eaten from the pack or serving dish']
    },
    protein: {
      g:['A palm','About one palm of meat, fish, eggs, tofu or pulses'],
      a:['Light','Less than a palm'],
      r:['Barely any','A mouthful or less'],
      n:NONE
    },
    carb: {
      g:['A cupped hand','Up to one cupped hand of rice, pasta, potato or bread'],
      a:['Two cupped hands','Between one and two cupped hands'],
      r:['Three or more','Three cupped hands or more'],
      n:NONE
    },
    fat: {
      g:['A thumb','Up to one thumb of oil, butter, cheese or dressing'],
      a:['Two thumbs','Between one and two thumbs'],
      r:['Three or more','Three thumbs or more, or deep-fried'],
      n:NONE
    }
  },
  snack: {
    portion: {
      g:['One handful','Fits in one cupped hand'],
      a:['Two handfuls','Two cupped hands'],
      r:['From the pack','Eaten from the packet until it ran out']
    },
    protein: {
      g:['Half a palm','A yoghurt, an egg, a slice of ham'],
      a:['Less than half a palm','A few bites'],
      r:['Barely any','A bite or two'],
      n:NONE
    },
    carb: {
      g:['A small handful','Up to a small handful, or one piece of fruit'],
      a:['Two handfuls','Between one and two handfuls'],
      r:['Three or more','Three handfuls or more'],
      n:NONE
    },
    fat: {
      g:['A thumb','Up to one thumb of nuts, cheese or spread'],
      a:['Two thumbs','Between one and two thumbs'],
      r:['Three or more','Three thumbs or more'],
      n:NONE
    }
  }
};

/* ---------- Points: edit these to suit your plan ---------- */
const POINTS = { meal:{g:2,a:4,r:8}, snack:{g:1,a:2,r:4} };
const DAY_GREEN_MAX = 10;   // 10 or less = green day
const DAY_AMBER_MAX = 20;   // 11 to 20 = amber day, above = red day
// A meal takes the colour of its worst light. Grey (none in this) never counts against it.
// To make a protein-free meal count as red, change null to 'r'.
const MEAL_NO_PROTEIN_COUNTS_AS = null;
const kind = e => e.meal==='Snack' ? 'snack' : 'meal';
function mealColour(e){
  const v = [e.portion, e.protein, e.carb, e.fat].filter(x => x && x!=='n');
  if(e.protein==='n' && e.meal!=='Snack' && MEAL_NO_PROTEIN_COUNTS_AS) v.push(MEAL_NO_PROTEIN_COUNTS_AS);
  return v.includes('r') ? 'r' : v.includes('a') ? 'a' : 'g';
}
const mealPoints = e => POINTS[kind(e)][mealColour(e)];
function dayColour(total){ return total <= DAY_GREEN_MAX ? 'g' : total <= DAY_AMBER_MAX ? 'a' : 'r'; }
const MEALS = ['Breakfast','Lunch','Dinner','Snack','Water'];
const WATER_MAX = 5, WATER_STEP = 0.25;   // litres: slider range and step
const LOC_DEFAULTS = ['Home','Restaurant','Friends','Family','Work','On the go'];
const KEY_E='mealCheckin.entries', KEY_L='mealCheckin.locations', KEY_W='mealCheckin.water';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const pad = n => String(n).padStart(2,'0');
function localDate(d=new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
const makeId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }

let entries = load(KEY_E, []);
let water = load(KEY_W, {});            // one running total per day: {'2026-10-07': 2.5}
if(!water || typeof water!=='object' || Array.isArray(water)) water = {};
let locs = load(KEY_L, LOC_DEFAULTS.slice());
let st = {meal:null, loc:null, portion:null, protein:null, carb:null, fat:null};
let confirmId = null, confirmWater = false;
let viewDate = localDate(), waterDate = localDate(), waterFrom = 'front';

/* ---------- day data ---------- */
const isToday = d => d === localDate();
const foodOn = d => entries.filter(e => e.date === d).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
const litresOn = d => (typeof water[d]==='number' && water[d]>0) ? water[d] : 0;
const hasAnyOn = d => foodOn(d).length>0 || litresOn(d)>0;
const fmtL = n => n.toLocaleString(undefined,{maximumFractionDigits:2}) + ' L';
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;
function parseDay(d){ const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd); }
const dayLabel = (d,long) => parseDay(d).toLocaleDateString(undefined, long
  ? {weekday:'long',day:'numeric',month:'long',year:'numeric'}
  : {weekday:'short',day:'numeric',month:'short'});
function dayStats(d){
  const list = foodOn(d);
  const total = list.reduce((n,e)=>n+mealPoints(e),0);
  const meals = list.filter(e=>e.meal!=='Snack').length;
  return {list, total, meals, snacks:list.length-meals, colour:list.length?dayColour(total):'n', litres:litresOn(d)};
}

/* ---------- screens ---------- */
function show(id){ ['s1','s2','s3','s4','s5'].forEach(s => $('#'+s).classList.toggle('hidden', s!==id)); window.scrollTo(0,0); }

function renderS1(){
  const isWater = st.meal==='Water';
  $('#mealChips').innerHTML = MEALS.map(m => `<button class="chip${st.meal===m?' sel':''}" data-m="${esc(m)}">${esc(m)}</button>`).join('');
  $('#locChips').innerHTML = locs.map(l => `<button class="chip${st.loc===l?' sel':''}" data-l="${esc(l)}">${esc(l)}</button>`).join('')
    + `<button class="chip add" id="addChip">+ Add</button>`;
  $('#whereBox').classList.toggle('hidden', isWater);
  $('#go1').disabled = !(st.meal && (isWater || st.loc));
  $('#toDay').classList.toggle('hidden', !hasAnyOn(localDate()));
}
function renderGroup(box, key){
  const set = RULES[st.meal==='Snack'?'snack':'meal'][key];
  const order = set.n ? ['g','a','r','n'] : ['g','a','r'];
  $('#'+box).innerHTML = order.map(c =>
    `<button class="rc ${c}${st[key]===c?' sel':''}" data-k="${key}" data-c="${c}">
       <span class="dot"></span><span><span class="nm">${esc(set[c][0])}</span><span class="rl">${esc(set[c][1])}</span></span>
     </button>`).join('');
}
function renderS2(){
  $('#ctx').textContent = st.meal + ' · ' + st.loc;
  renderGroup('portionBox','portion'); renderGroup('proteinBox','protein');
  renderGroup('carbBox','carb'); renderGroup('fatBox','fat');
  $('#save').disabled = !(st.portion && st.protein && st.carb && st.fat);
}
function dotsHtml(e){
  const d = (lab,c) => `<span><i class="${c}"></i>${lab}</span>`;
  return `<div class="dots">${d('Portion',e.portion)}${d('Protein',e.protein)}${d('Carbs',e.carb)}${d('Fat',e.fat)}</div>`;
}
function summaryHtml(s){
  if(!s.list.length) return '';
  const word = {g:'Green day', a:'Amber day', r:'Red day'}[s.colour];
  const left = DAY_GREEN_MAX - s.total;
  const sub = left >= 0 ? `${left} left before amber` : `${-left} over the green line`;
  return `<div class="sum ${s.colour}"><div class="pts">${s.total}</div>
    <div><div class="lbl">${word}</div><div class="sub2">${plural(s.meals,'meal')}, ${plural(s.snacks,'snack')} · ${sub}</div></div></div>`;
}
function waterCardHtml(d){
  const l = litresOn(d); if(!l) return '';
  const pct = Math.min(100, l/WATER_MAX*100);
  return `<div class="entry"><div class="top">Water</div>
    <div class="mn">${esc(fmtL(l))}</div>
    <div class="wbar"><span style="width:${pct}%"></span></div>
    <button class="link wchange" data-wchange="1">Change</button>
    <button class="x" data-wdel="1" aria-label="Delete water entry">&times;</button>
    ${confirmWater ? `<div class="confirm">Delete the water entry? <button data-wcancel="1">Cancel</button><button data-wyes="1">Delete</button></div>` : ''}
  </div>`;
}
function renderS3(){
  const d = viewDate, today = isToday(d), s = dayStats(d);
  $('#dayTitle').textContent = today ? "Today's meals" : dayLabel(d, true);
  $('#back3').classList.toggle('hidden', today);
  $('#again').classList.toggle('hidden', !today);
  $('#backToday').classList.toggle('hidden', today);
  $('#summary').innerHTML = summaryHtml(s) + waterCardHtml(d);
  $('#list').innerHTML = s.list.length ? s.list.map(e => {
    const t = new Date(e.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return `<div class="entry">
      <div class="top">${esc(t)} · ${esc(e.location)}</div>
      <div class="mn">${esc(e.meal)}<span class="badge"><i class="${mealColour(e)}"></i>${mealPoints(e)} pt${mealPoints(e)===1?'':'s'}</span></div>
      ${dotsHtml(e)}
      <button class="x" data-del="${e.id}" aria-label="Delete entry">&times;</button>
      ${confirmId===e.id ? `<div class="confirm">Delete this entry? <button data-cancel="1">Cancel</button><button data-yes="${e.id}">Delete</button></div>` : ''}
    </div>`;
  }).join('') : (s.litres ? '' : `<p class="quiet">Nothing logged ${today ? 'yet today' : 'on this day'}.</p>`);
}
function renderS4(){
  const days = new Set(entries.map(e => e.date));
  Object.keys(water).forEach(k => { if(litresOn(k)) days.add(k); });
  const sorted = [...days].sort().reverse();
  $('#hist').innerHTML = sorted.length ? sorted.map(d => {
    const s = dayStats(d);
    const bits = [];
    if(s.list.length) bits.push(`${plural(s.meals,'meal')}, ${plural(s.snacks,'snack')}`);
    if(s.litres) bits.push(fmtL(s.litres) + ' water');
    return `<button class="hrow" data-day="${d}">
      <span><span class="hd">${esc(dayLabel(d))}${isToday(d)?' · today':''}</span><span class="hs">${esc(bits.join(' · '))}</span></span>
      <span class="hr"><span class="hp">${s.list.length ? s.total : '–'}</span><i class="hc ${s.colour}"></i></span>
    </button>`;
  }).join('') : `<p class="quiet">Nothing logged yet.</p>`;
}
function resetFlow(){ st = {meal:null, loc:null, portion:null, protein:null, carb:null, fat:null}; }
function goToday(){
  viewDate = localDate(); confirmId = null; confirmWater = false;
  if(hasAnyOn(viewDate)){ renderS3(); show('s3'); } else { resetFlow(); renderS1(); show('s1'); }
}

/* ---------- water ---------- */
function updWater(){
  const r = $('#wRange'), v = parseFloat(r.value) || 0, pct = v/WATER_MAX*100;
  $('#wRead').textContent = fmtL(v);
  r.style.background = `linear-gradient(to right, var(--water) ${pct}%, var(--line) ${pct}%)`;
}
function openWater(d, from){
  waterDate = d; waterFrom = from;
  const r = $('#wRange'); r.min = 0; r.max = WATER_MAX; r.step = WATER_STEP; r.value = litresOn(d);
  $('#wctx').textContent = isToday(d) ? 'Water today' : 'Water · ' + dayLabel(d);
  updWater(); show('s5');
}
function saveWater(){
  const v = parseFloat($('#wRange').value) || 0;
  if(v > 0) water[waterDate] = v; else delete water[waterDate];
  store(KEY_W, water);
  resetFlow(); viewDate = waterDate; confirmWater = false; confirmId = null;
  renderS3(); show('s3');
}
$('#wRange').addEventListener('input', updWater);

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if(!b) return;
  if(b.dataset.m){ st.meal = b.dataset.m; renderS1(); }
  else if(b.dataset.l){ st.loc = b.dataset.l; renderS1(); }
  else if(b.id==='addChip'){ $('#addRow').classList.remove('hidden'); $('#addInput').focus(); }
  else if(b.id==='addOk'){ addLoc(); }
  else if(b.id==='go1'){
    if(st.meal==='Water'){ openWater(localDate(), 'front'); }
    else { st.portion=st.protein=st.carb=st.fat=null; renderS2(); show('s2'); }
  }
  else if(b.id==='back2'){ renderS1(); show('s1'); }
  else if(b.dataset.k){ st[b.dataset.k] = b.dataset.c; renderS2(); }
  else if(b.id==='save'){ saveEntry(); }
  else if(b.id==='toDay'){ goToday(); }
  else if(b.id==='again'){ resetFlow(); $('#addRow').classList.add('hidden'); renderS1(); show('s1'); }
  else if(b.id==='toHist' || b.id==='toHist2'){ renderS4(); show('s4'); }
  else if(b.id==='back3'){ renderS4(); show('s4'); }
  else if(b.id==='back4'){ renderS1(); show('s1'); }
  else if(b.id==='backToday'){ goToday(); }
  else if(b.dataset.day){ viewDate = b.dataset.day; confirmId = null; confirmWater = false; renderS3(); show('s3'); }
  else if(b.dataset.del){ confirmId = b.dataset.del; renderS3(); }
  else if(b.dataset.cancel){ confirmId = null; renderS3(); }
  else if(b.dataset.yes){ entries = entries.filter(e => e.id !== b.dataset.yes); store(KEY_E, entries); confirmId = null; renderS3(); }
  else if(b.id==='wSave'){ saveWater(); }
  else if(b.id==='back5'){ if(waterFrom==='card'){ renderS3(); show('s3'); } else { renderS1(); show('s1'); } }
  else if(b.dataset.wchange){ openWater(viewDate, 'card'); }
  else if(b.dataset.wdel){ confirmWater = true; renderS3(); }
  else if(b.dataset.wcancel){ confirmWater = false; renderS3(); }
  else if(b.dataset.wyes){ delete water[viewDate]; store(KEY_W, water); confirmWater = false; renderS3(); }
  else if(b.id==='copy'){ copyText(); }
});
$('#addInput').addEventListener('keydown', e => { if(e.key==='Enter') addLoc(); });
function addLoc(){
  const v = $('#addInput').value.trim(); if(!v) return;
  const hit = locs.find(l => l.toLowerCase()===v.toLowerCase());
  if(!hit){ locs.push(v); store(KEY_L, locs); }
  st.loc = hit || v; $('#addInput').value=''; $('#addRow').classList.add('hidden'); renderS1();
}
function saveEntry(){
  const now = new Date();
  entries.push({id:makeId(), date:localDate(now), timestamp:now.toISOString(),
    meal:st.meal, location:st.loc, portion:st.portion, protein:st.protein, carb:st.carb, fat:st.fat});
  store(KEY_E, entries);
  resetFlow(); viewDate = localDate(); confirmId = null; confirmWater = false;
  renderS3(); show('s3');
}
function copyText(){
  const s = dayStats(viewDate);
  const lines = [dayLabel(viewDate, true), ''];
  s.list.forEach(e => {
    const t = new Date(e.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const set = RULES[e.meal==='Snack'?'snack':'meal'];
    lines.push(`${t} ${e.meal} (${e.location}): ${TL[mealColour(e)]}, ${mealPoints(e)} pt${mealPoints(e)===1?'':'s'}`);
    lines.push(`  Portion: ${TL[e.portion]} (${set.portion[e.portion][0]})`);
    lines.push(`  Protein: ${TL[e.protein]} (${set.protein[e.protein][0]})`);
    lines.push(`  Carbs: ${TL[e.carb]} (${set.carb[e.carb][0]})`);
    lines.push(`  Fat: ${TL[e.fat]} (${set.fat[e.fat][0]})`);
    lines.push('');
  });
  if(s.list.length) lines.push(`Day total: ${s.total} points, ${ {g:'green',a:'amber',r:'red'}[s.colour] } day`);
  if(s.litres) lines.push(`Water: ${fmtL(s.litres)}`);
  const text = lines.join('\n').trim();
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(()=>toast('Copied'), ()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('Copied');}catch(e){} ta.remove(); });
}

/* ---------- start ---------- */
$('#today').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
renderS1();
goToday();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
